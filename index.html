<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invista+ | Scanner Fundamentalista</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg: #f4f7fa;
            --card-bg: #ffffff;
            --primary: #004a9f;
            --primary-hover: #003675;
            --text-main: #333333;
            --text-muted: #667788;
            --border: #dde4ec;
            --good: #28a745;
            --bad: #dc3545;
            --neutral: #6c757d;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0 1rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .top-nav {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .logo-icon {
            background: var(--primary);
            color: white;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .btn-auth {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-auth:hover { background-color: var(--primary-hover); }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .header-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 50px;
            box-shadow: 0 2px 10px rgba(0, 30, 80, 0.08);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .tab-btn {
            background-color: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--primary);
            color: white;
        }

        .perfil-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .perfil-label { font-size: 0.9rem; color: var(--text-main); font-weight: 600; }

        .perfil-selector {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .perfil-selector select {
            border: none;
            padding: 10px 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
            outline: none;
            background: transparent;
            cursor: pointer;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 30, 80, 0.05);
            border: 1px solid var(--border);
        }

        .search-box input {
            flex: 1;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            outline: none;
            background: transparent;
        }

        .search-box button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover { background-color: var(--primary-hover); }
        .search-box button:disabled { background-color: var(--border); cursor: not-allowed; }

        .results-header {
            text-align: center;
            font-size: 1.4rem;
            color: var(--text-main);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .results-header span {
            color: var(--primary);
            font-weight: 700;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
        }

        .btn-fav {
            background: transparent;
            border: none;
            color: var(--border);
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            padding: 0;
            display: flex;
            align-items: center;
        }
        
        .btn-fav:hover { color: #f1c40f; transform: scale(1.1); }
        .btn-fav.active { color: #f1c40f; }

        .selic-info { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 30px; }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 40px 0 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 30, 80, 0.04);
            border-left: 5px solid transparent;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 30, 80, 0.08); }
        .card.good { border-left-color: var(--good); }
        .card.bad { border-left-color: var(--bad); }
        .card.neutral { border-left-color: var(--border); }

        .card-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* --- ESTILOS DOS TOOLTIPS RESGATADOS --- */
        .help-icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--border);
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 700;
            cursor: help;
            flex-shrink: 0;
            text-transform: none;
            letter-spacing: 0;
        }

        .help-icon:hover, .help-icon:focus {
            background: var(--primary);
            color: #fff;
            outline: none;
        }

        .help-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            background: var(--text-main);
            color: #fff;
            font-size: 0.78rem;
            font-weight: 400;
            line-height: 1.4;
            text-transform: none;
            letter-spacing: 0;
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s ease;
            z-index: 20;
            pointer-events: none;
        }

        .help-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--text-main);
        }

        .help-icon:hover .help-tooltip,
        .help-icon:focus .help-tooltip {
            opacity: 1;
            visibility: visible;
        }
        /* --------------------------------------- */

        .card-body { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
        .card-value { font-size: 1.4rem; font-weight: 700; color: var(--text-main); text-align: right; }

        .card-caption { text-align: right; font-size: 0.78rem; font-weight: 600; margin-top: 6px; }
        .card-caption.good { color: var(--good); }
        .card-caption.bad { color: var(--bad); }

        .message {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.1rem;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .fav-item-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .fav-item-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header class="top-nav">
        <a href="index.html" class="logo-container">
            <div class="logo-icon">📈</div>
            Invista+
        </a>
        <button class="btn-auth" id="btn-auth" onclick="window.location.href='login.html'">Entrar</button>
    </header>

    <div class="container">
        <div class="header-tabs">
            <button class="tab-btn active" onclick="setMode('acoes')" id="btn-acoes">Ações</button>
            <button class="tab-btn" onclick="setMode('fiis')" id="btn-fiis">FIIs</button>
            <button class="tab-btn" onclick="setMode('favoritos')" id="btn-favoritos">Favoritos</button>
        </div>

        <div class="perfil-row" id="perfilRow">
            <span class="perfil-label">Avaliar sob a ótica do Perfil:</span>
            <div class="perfil-selector">
                <select id="select-perfil" onchange="setPerfil(this.value)">
                    <option value="conservador">Conservador (Foco em Segurança)</option>
                    <option value="moderado" selected>Moderado (Equilíbrio Valor e Crescimento)</option>
                    <option value="arrojado">Arrojado (Foco em Multiplicação)</option>
                </select>
            </div>
        </div>

        <div class="search-box" id="searchBox">
            <input type="text" id="tickerInput" placeholder="Digite o ticker (ex: PETR4, BBAS3)">
            <button id="searchBtn" onclick="buscar()">Pesquisar</button>
        </div>

        <div id="resultContainer">
            <div class="message">Pronto para buscar Ações.</div>
        </div>
    </div>

    <!-- Firebase + Script da Aplicação -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        // SUA CHAVE DA API AQUI
        const firebaseConfig = {
            apiKey: "AIzaSyDWQVHJPSuEx0V_S2KfI2y--3N8oYJqJ0M", 
            authDomain: "invistamais.firebaseapp.com",
            projectId: "invistamais",
            storageBucket: "invistamais.firebasestorage.app",
            messagingSenderId: "79883291953",
            appId: "1:79883291953:web:bb7ac4f41f62f72fd07410"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userFavorites = [];
        let currentMode = 'acoes';
        let currentPerfil = 'moderado';

        // --- DICIONÁRIO DE TOOLTIPS RESGATADO ---
        const TOOLTIPS = {
            'Cotação Atual': 'Preço atual de negociação na bolsa.',
            'Valor Justo (Graham Padrão)': 'Estimativa de valor justo pela fórmula clássica de Graham, cruzando lucro e patrimônio por ação.',
            'Valor Justo (Graham Rev.)': 'Versão revisada da fórmula de Graham, que também considera o crescimento esperado e a taxa de juros atual.',
            'Valor Justo (Graham Tupiniquim)': 'Adaptação da fórmula de Graham com um multiplicador mais conservador, pensada para o patamar de juros no Brasil.',
            'Preço Teto (Bazin 6%)': 'Preço máximo que, dado o histórico de dividendos, ainda garante um yield mínimo de 6% ao ano.',
            'Preço Teto (Bazin 8%)': 'Preço máximo que, dado o histórico de dividendos, ainda garante um yield mínimo de 8% ao ano.',
            'P/L': 'Quantos anos de lucro atual seriam necessários para "pagar" o preço da ação. Quanto menor, mais barata ela parece frente ao lucro.',
            'P/VP': 'Compara o preço com o valor patrimonial por ação. Próximo de 1 indica preço próximo ao valor contábil.',
            'DY (12M)': 'Percentual de dividendos pagos nos últimos 12 meses em relação à cotação atual.',
            'Payout': 'Fatia do lucro distribuída como dividendos e JCP. Quanto maior, menor a parte reinvestida no negócio.',
            'ROE': 'Retorno gerado sobre o patrimônio dos acionistas — mede a eficiência em transformar capital próprio em lucro.',
            'ROIC': 'Retorno sobre o capital total investido na operação, incluindo dívida.',
            'ROA': 'Retorno gerado sobre o total de ativos da empresa.',
            'Margem Bruta': 'Percentual da receita que sobra após descontar apenas o custo direto dos produtos ou serviços vendidos.',
            'Margem EBITDA': 'Percentual da receita convertido em caixa operacional, antes de juros, impostos, depreciação e amortização.',
            'Margem Líquida': 'Percentual da receita que sobra como lucro depois de todas as despesas.',
            'Dív. Líq./Patrimônio': 'Compara o endividamento líquido com o patrimônio. Quanto menor, menor a dependência de capital de terceiros.',
            'Dív. Líq./EBITDA': 'Em quantos anos a empresa quitaria sua dívida líquida usando a geração de caixa operacional atual.',
            'Liquidez Corrente': 'Capacidade de pagar obrigações de curto prazo com os ativos de curto prazo. Acima de 1 costuma indicar folga.',
            'LPA (Lucro por Ação)': 'Lucro líquido dividido pelo número de ações — quanto a empresa lucrou por ação no período.',
            'VPA (Valor Patr. Ação)': 'Patrimônio líquido dividido pelo número de ações — o valor contábil de cada ação.',
            'CAGR Crescimento 5A': 'Crescimento médio anual do lucro nos últimos 5 anos.',
            'Giro Ativos': 'Quanto a empresa gera de receita para cada real investido em ativos — mede a eficiência no uso dos recursos.',
            'Cotas p/ Bola de Neve (EBN)': 'Número de cotas necessárias para que o próprio rendimento mensal já compre uma cota nova, sem novo aporte.',
            'Valor Necessário (VN)': 'Quanto capital, ao preço atual da cota, seria preciso para atingir a bola de neve.',
            'Último Rendimento': 'Valor por cota pago no último mês.',
            'Liquidez Diária': 'Volume médio negociado por dia — indica a facilidade de comprar ou vender sem afetar o preço.',
            'Variação (12M)': 'Variação da cotação nos últimos 12 meses.',
            'Val. Patr. p/ Cota': 'Valor patrimonial do fundo dividido pelo número de cotas.',
            'Valor Patrimonial': 'Patrimônio líquido total do fundo.',
            'Vacância': 'Percentual da área ou receita potencial do fundo que está sem inquilino.',
            'Nº de Cotistas': 'Quantidade de investidores que possuem cotas do fundo.',
            'Segmento': 'Tipo de ativo em que o fundo investe (lajes corporativas, shoppings, logística, papel, etc.).',
            'Mandato': 'Estratégia de atuação do fundo — desenvolvimento, renda, híbrido, entre outras.',
            'Tipo de Fundo': 'Classificação regulatória do fundo (tijolo, papel, fundo de fundos, híbrido).',
            'Tipo de Gestão': 'Se as decisões de investimento do fundo são ativas ou passivas (indexadas a um benchmark).',
            'Taxa de Admin.': 'Percentual cobrado anualmente pela gestora sobre o patrimônio do fundo.'
        };

        // 1. OUVINTE DE ESTADO (Logado vs Deslogado)
        onAuthStateChanged(auth, async (user) => {
            const btnAuth = document.getElementById('btn-auth');
            if (user) {
                currentUser = user;
                btnAuth.innerText = 'Sair';
                btnAuth.onclick = async () => {
                    await signOut(auth);
                    window.location.reload();
                };
                
                // Busca os favoritos
                const docRef = doc(db, "users", currentUser.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().favoritos) {
                    userFavorites = docSnap.data().favoritos;
                }
            } else {
                currentUser = null;
                userFavorites = [];
                btnAuth.innerText = 'Entrar';
                btnAuth.onclick = () => window.location.href = 'login.html';
            }
        });

        // 2. FUNÇÕES DE INTERFACE EXPORTADAS PRO HTML
        window.setMode = (mode) => {
            currentMode = mode;
            document.getElementById('btn-acoes').classList.remove('active');
            document.getElementById('btn-fiis').classList.remove('active');
            document.getElementById('btn-favoritos').classList.remove('active');
            document.getElementById(`btn-${mode}`).classList.add('active');

            const searchBox = document.getElementById('searchBox');
            const perfilRow = document.getElementById('perfilRow');

            if (mode === 'favoritos') {
                searchBox.style.display = 'none';
                perfilRow.style.display = 'none';
                abrirFavoritos();
                return;
            }

            searchBox.style.display = 'flex';
            perfilRow.style.display = 'flex';
            const placeholder = mode === 'acoes' ? 'ex: PETR4, BBAS3, WEGE3' : 'ex: MXRF11, HGLG11, KNCR11';
            document.getElementById('tickerInput').placeholder = `Digite o ticker (${placeholder})`;
            document.getElementById('tickerInput').value = '';
            document.getElementById('resultContainer').innerHTML = `<div class="message">Pronto para buscar ${mode === 'acoes' ? 'Ações' : 'FIIs'}.</div>`;
        };

        window.setPerfil = (perfil) => {
            currentPerfil = perfil;
            const ticker = document.getElementById('tickerInput').value.trim();
            if (ticker && document.querySelector('.results-header')) window.buscar();
        };

        // 3. MÁGICA DA ESTRELINHA E FAVORITOS
        window.toggleFavorito = async (btn, ticker) => {
            if (!currentUser) {
                alert("Você precisa estar logado para salvar favoritos!");
                window.location.href = 'login.html';
                return;
            }

            const docRef = doc(db, "users", currentUser.uid);
            
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                userFavorites = userFavorites.filter(t => t !== ticker);
                await setDoc(docRef, { favoritos: arrayRemove(ticker) }, { merge: true });
            } else {
                btn.classList.add('active');
                userFavorites.push(ticker);
                await setDoc(docRef, { favoritos: arrayUnion(ticker) }, { merge: true });
            }
        };

        function abrirFavoritos() {
            const container = document.getElementById('resultContainer');
            
            if (!currentUser) {
                container.innerHTML = `
                    <div class="message">
                        <h3 style="color: var(--primary);">Acesso Restrito</h3>
                        <p>Faça login na Invista+ para salvar e acessar sua carteira de acompanhamento rápida.</p>
                    </div>`;
                return;
            }

            if (userFavorites.length === 0) {
                container.innerHTML = `<div class="message">Você ainda não tem nenhum ativo salvo. Pesquise um ticker e clique na estrela!</div>`;
                return;
            }

            let gridHTML = '<div class="results-grid">';
            userFavorites.forEach(ticker => {
                gridHTML += `<button class="fav-item-btn" onclick="pesquisarFavorito('${ticker}')">${ticker}</button>`;
            });
            gridHTML += '</div>';

            container.innerHTML = `
                <div class="section-title" style="margin-top:0;">Meus Ativos Salvos</div>
                ${gridHTML}
            `;
        }

        // NOVO: A lógica de auto-pesquisa perfeita
        window.pesquisarFavorito = (ticker) => {
            // Se terminar em '11', provavelmente é FII, se não é Ação
            const modoSugerido = ticker.endsWith('11') ? 'fiis' : 'acoes';
            window.setMode(modoSugerido);
            
            // Preenche o input e força a pesquisa
            document.getElementById('tickerInput').value = ticker;
            window.buscar();
        };

        // 4. MOTOR QUÂNTICO (Buscador + Tooltips + Ícones)
        function getIcon(cls) {
            if (cls === 'good') {
                return `<svg style="color:var(--good); min-width: 24px;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
            }
            if (cls === 'bad') {
                return `<svg style="color:var(--bad); min-width: 24px;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
            }
            return ``;
        }

        function helpBadge(title) {
            const texto = TOOLTIPS[title];
            if (!texto) return '';
            return `<span class="help-icon" tabindex="0">?<span class="help-tooltip">${texto}</span></span>`;
        }

        function formatMargem(margem) {
            if (margem === null || margem === undefined || isNaN(margem)) return '';
            const abaixo = margem >= 0;
            const texto = `${Math.abs(margem).toFixed(1).replace('.', ',')}% ${abaixo ? 'abaixo' : 'acima'} do valor justo`;
            return `<div class="card-caption ${abaixo ? 'good' : 'bad'}">${texto}</div>`;
        }

        function createCard(title, dataObj) {
            const val = dataObj?.value || '-';
            const cls = dataObj?.class || 'neutral';
            const caption = dataObj?.margem !== undefined ? formatMargem(dataObj.margem) : '';
            return `
                <div class="card ${cls}">
                    <div class="card-title">${title}${helpBadge(title)}</div>
                    <div class="card-body">
                        ${getIcon(cls)}
                        <span class="card-value">${val}</span>
                    </div>
                    ${caption}
                </div>
            `;
        }

        function apenasValor(dataObj) { return { value: dataObj?.value || '-', class: 'neutral' }; }

        window.buscar = async () => {
            const ticker = document.getElementById('tickerInput').value.trim().toUpperCase();
            const container = document.getElementById('resultContainer');
            const btn = document.getElementById('searchBtn');

            if (!ticker) return;

            btn.disabled = true;
            container.innerHTML = `<div class="message">Aspirando dados de <strong>${ticker}</strong>... Aguarde.</div>`;
            
            const baseUrl = 'https://invistaai-ochre.vercel.app'; 
            const endpoint = currentMode === 'acoes' ? `${baseUrl}/api/acoes` : `${baseUrl}/api/fiis`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticker, perfil: currentPerfil })
                });

                const data = await response.json();

                if (!response.ok) {
                    container.innerHTML = `<div class="message" style="color: var(--bad); border-color: #ef9a9a;">${data.error}</div>`;
                    return;
                }

                const isFav = userFavorites.includes(data.ticker);

                if (currentMode === 'acoes') {
                    container.innerHTML = `
                        <div class="results-header">
                            Relatório Fundamentalista
                            <span>
                                ${data.ticker} 
                                <button class="btn-fav ${isFav ? 'active' : ''}" onclick="toggleFavorito(this, '${data.ticker}')" title="Favoritar">★</button>
                            </span>
                        </div>
                        <div class="selic-info">Selic: ${data.selicUtilizada}% · Perfil: ${data.perfil}</div>
                        
                        <div class="section-title">Valuation (Preço Justo)</div>
                        <div class="results-grid">
                            ${createCard('Cotação Atual', apenasValor(data.cotacao))}
                            ${createCard('Valor Justo (Graham Padrão)', data.valorGrahamPadrao)}
                            ${createCard('Valor Justo (Graham Rev.)', data.valorGrahamRev)}
                            ${createCard('Valor Justo (Graham Tupiniquim)', data.valorGrahamTupiniquim)}
                            ${createCard('Preço Teto (Bazin 6%)', data.precoTeto6)}
                            ${createCard('Preço Teto (Bazin 8%)', data.precoTeto8)}
                        </div>

                        <div class="section-title">Múltiplos de Preço</div>
                        <div class="results-grid">
                            ${createCard('P/L', data.pl)}
                            ${createCard('P/VP', data.pvp)}
                        </div>

                        <div class="section-title">Dividendos & Proventos</div>
                        <div class="results-grid">
                            ${createCard('DY (12M)', data.dy)}
                            ${createCard('Payout', apenasValor(data.payout))}
                        </div>

                        <div class="section-title">Indicadores de Rentabilidade</div>
                        <div class="results-grid">
                            ${createCard('ROE', data.roe)}
                            ${createCard('ROIC', apenasValor(data.roic))}
                            ${createCard('ROA', apenasValor(data.roa))}
                            ${createCard('Margem Bruta', apenasValor(data.margemBruta))}
                            ${createCard('Margem EBITDA', apenasValor(data.margemEbitda))}
                            ${createCard('Margem Líquida', data.margemLiquida)}
                        </div>

                        <div class="section-title">Endividamento & Liquidez</div>
                        <div class="results-grid">
                            ${createCard('Dív. Líq./Patrimônio', data.divLiqPatrimonio)}
                            ${createCard('Dív. Líq./EBITDA', apenasValor(data.divLiqEbitda))}
                            ${createCard('Liquidez Corrente', data.liquidezCorrente)}
                        </div>

                        <div class="section-title">Outros Indicadores</div>
                        <div class="results-grid">
                            ${createCard('LPA (Lucro por Ação)', apenasValor(data.lpa))}
                            ${createCard('VPA (Valor Patr. Ação)', apenasValor(data.vpa))}
                            ${createCard('CAGR Crescimento 5A', apenasValor(data.cagr5a))}
                            ${createCard('Giro Ativos', apenasValor(data.giroAtivos))}
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="results-header">
                            Relatório do Fundo
                            <span>
                                ${data.ticker}
                                <button class="btn-fav ${isFav ? 'active' : ''}" onclick="toggleFavorito(this, '${data.ticker}')" title="Favoritar">★</button>
                            </span>
                        </div>
                        <div class="selic-info">Perfil de avaliação: ${data.perfil}</div>

                        <div class="section-title">Efeito Bola de Neve (EBN)</div>
                        <div class="results-grid">
                            ${createCard('Cotas p/ Bola de Neve (EBN)', apenasValor(data.ebn))}
                            ${createCard('Valor Necessário (VN)', apenasValor(data.vn))}
                            ${createCard('Último Rendimento', apenasValor(data.ultimoRendimento))}
                        </div>

                        <div class="section-title">Indicadores do Fundo</div>
                        <div class="results-grid">
                            ${createCard('Cotação Atual', apenasValor(data.cotacao))}
                            ${createCard('P/VP', data.pvp)}
                            ${createCard('DY (12M)', data.dy)}
                            ${createCard('Liquidez Diária', data.liquidezDiaria)}
                            ${createCard('Variação (12M)', apenasValor(data.variacao12m))}
                            ${createCard('Val. Patr. p/ Cota', apenasValor(data.vpa))}
                            ${createCard('Valor Patrimonial', data.valorPatrimonial)}
                            ${createCard('Vacância', data.vacancia)}
                            ${createCard('Nº de Cotistas', data.numeroCotistas)}
                        </div>

                        <div class="section-title">Perfil do Fundo</div>
                        <div class="results-grid">
                            ${createCard('Segmento', apenasValor(data.segmento))}
                            ${createCard('Mandato', apenasValor(data.mandato))}
                            ${createCard('Tipo de Fundo', apenasValor(data.tipoFundo))}
                            ${createCard('Tipo de Gestão', apenasValor(data.tipoGestao))}
                            ${createCard('Taxa de Admin.', apenasValor(data.taxaAdministracao))}
                        </div>
                    `;
                }
            } catch (error) {
                container.innerHTML = `<div class="message" style="color: var(--bad);">Erro de conexão com o Motor Quântico.</div>`;
            } finally {
                btn.disabled = false;
            }
        };

        document.getElementById('tickerInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') window.buscar();
        });
    </script>
</body>
</html>
