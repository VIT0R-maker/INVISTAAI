<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvistaAI — Scanner Fundamentalista</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg: #f4f7fa;
            --card-bg: #ffffff;
            --primary: #0052cc;
            --primary-hover: #003b91;
            --text-main: #333333;
            --text-muted: #667788;
            --border: #dde4ec;
            --good: #28a745;
            --bad: #dc3545;
            --neutral: #6c757d;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0 1rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Nova Barra de Navegação Superior */
        .top-nav {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .logo-icon {
            background: var(--primary);
            color: white;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .btn-entrar {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-entrar:hover { background-color: var(--primary-hover); }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .header-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 50px;
            box-shadow: 0 2px 10px rgba(0, 30, 80, 0.08);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .tab-btn {
            background-color: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--primary);
            color: white;
        }

        .perfil-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .perfil-label {
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .perfil-selector {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .perfil-selector select {
            border: none;
            padding: 10px 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
            outline: none;
            background: transparent;
            cursor: pointer;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 30, 80, 0.05);
            border: 1px solid var(--border);
        }

        .search-box input {
            flex: 1;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            outline: none;
            background: transparent;
        }

        .search-box button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover { background-color: var(--primary-hover); }
        .search-box button:disabled { background-color: var(--border); cursor: not-allowed; }

        .results-header {
            text-align: center;
            font-size: 1.4rem;
            color: var(--text-main);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .results-header span {
            color: var(--primary);
            font-weight: 700;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
        }

        /* Botão de Favorito (Estrela) */
        .btn-fav {
            background: transparent;
            border: none;
            color: var(--border);
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.2s;
            padding: 0;
            display: flex;
            align-items: center;
        }
        .btn-fav:hover { color: #f1c40f; }
        .btn-fav.active { color: #f1c40f; }

        .selic-info {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 40px 0 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 30, 80, 0.04);
            border-left: 5px solid transparent;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 30, 80, 0.08); }
        .card.good { border-left-color: var(--good); }
        .card.bad { border-left-color: var(--bad); }
        .card.neutral { border-left-color: var(--border); }

        .card-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .card-body {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
        }

        .card-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            text-align: right;
            overflow-wrap: break-word;
            word-break: normal;
        }

        .card-caption { text-align: right; font-size: 0.78rem; font-weight: 600; margin-top: 6px; }
        .card-caption.good { color: var(--good); }
        .card-caption.bad { color: var(--bad); }

        .message {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.1rem;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="logo-container">
            <div class="logo-icon">📈</div>
            Invista+
        </div>
        <button class="btn-entrar" onclick="window.location.href='login.html'">Entrar</button>
    </header>

    <div class="container">
        <div class="header-tabs">
            <button class="tab-btn active" onclick="setMode('acoes')" id="btn-acoes">Ações</button>
            <button class="tab-btn" onclick="setMode('fiis')" id="btn-fiis">FIIs</button>
            <button class="tab-btn" onclick="abrirFavoritos()" id="btn-favoritos">Favoritos</button>
        </div>

        <div class="perfil-row" id="perfilRow">
            <span class="perfil-label">Avaliar sob a ótica do Perfil:</span>
            <div class="perfil-selector">
                <select id="select-perfil" onchange="setPerfil(this.value)">
                    <option value="conservador">Conservador (Foco em Segurança)</option>
                    <option value="moderado" selected>Moderado (Equilíbrio Valor e Crescimento)</option>
                    <option value="arrojado">Arrojado (Foco em Multiplicação)</option>
                </select>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="tickerInput" placeholder="Digite o ticker (ex: PETR4, BBAS3)">
            <button id="searchBtn" onclick="buscar()">Pesquisar</button>
        </div>

        <div id="resultContainer">
            <div class="message">Pronto para buscar Ações.</div>
        </div>
    </div>

    <script>
        let currentMode = 'acoes';
        let currentPerfil = 'moderado';

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-acoes').classList.remove('active');
            document.getElementById('btn-fiis').classList.remove('active');
            document.getElementById('btn-favoritos').classList.remove('active');
            document.getElementById(`btn-${mode}`).classList.add('active');

            if (mode === 'favoritos') {
                abrirFavoritos();
                return;
            }

            const placeholder = mode === 'acoes' ? 'ex: PETR4, BBAS3, WEGE3' : 'ex: MXRF11, HGLG11, KNCR11';
            document.getElementById('tickerInput').placeholder = `Digite o ticker (${placeholder})`;
            document.getElementById('tickerInput').value = '';
            document.getElementById('resultContainer').innerHTML = `<div class="message">Pronto para buscar ${mode === 'acoes' ? 'Ações' : 'FIIs'}.</div>`;
        }

        function setPerfil(perfil) {
            currentPerfil = perfil;
            const ticker = document.getElementById('tickerInput').value.trim();
            if (ticker && document.querySelector('.results-header')) buscar();
        }

        function toggleFavorito(btn, ticker) {
            // Lógica futura conectada ao Firebase
            btn.classList.toggle('active');
            if(btn.classList.contains('active')) {
                alert(`${ticker} adicionado aos favoritos! (Integração com DB em breve)`);
            } else {
                alert(`${ticker} removido dos favoritos!`);
            }
        }

        function abrirFavoritos() {
            document.getElementById('resultContainer').innerHTML = `
                <div class="message">
                    <h3>Meus Ativos Favoritos</h3>
                    <p>Você precisa estar logado para ver seus ativos salvos.</p>
                    <button class="btn-entrar" onclick="window.location.href='login.html'" style="margin-top: 15px;">Fazer Login</button>
                </div>
            `;
        }

        function createCard(title, dataObj) {
            const val = dataObj?.value || '-';
            const cls = dataObj?.class || 'neutral';
            return `
                <div class="card ${cls}">
                    <div class="card-title">${title}</div>
                    <div class="card-body"><span class="card-value">${val}</span></div>
                </div>
            `;
        }

        function apenasValor(dataObj) {
            return { value: dataObj?.value || '-', class: 'neutral' };
        }

        async function buscar() {
            const ticker = document.getElementById('tickerInput').value.trim().toUpperCase();
            const container = document.getElementById('resultContainer');
            const btn = document.getElementById('searchBtn');

            if (!ticker) return;

            btn.disabled = true;
            container.innerHTML = `<div class="message">Aspirando dados de <strong>${ticker}</strong>... Aguarde.</div>`;
            
            // URL da sua Vercel
            const baseUrl = 'https://invistaai-ochre.vercel.app'; 
            const endpoint = currentMode === 'acoes' ? `${baseUrl}/api/acoes` : `${baseUrl}/api/fiis`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticker, perfil: currentPerfil })
                });

                const data = await response.json();

                if (!response.ok) {
                    container.innerHTML = `<div class="message" style="color: var(--bad); border-color: #ef9a9a;">${data.error}</div>`;
                    return;
                }

                if (currentMode === 'acoes') {
                    container.innerHTML = `
                        <div class="results-header">
                            Relatório Fundamentalista
                            <span>
                                ${data.ticker} 
                                <button class="btn-fav" onclick="toggleFavorito(this, '${data.ticker}')" title="Favoritar ativo">★</button>
                            </span>
                        </div>
                        <div class="selic-info">Selic: ${data.selicUtilizada}% · Perfil: ${data.perfil}</div>
                        <div class="section-title">Valuation & Múltiplos</div>
                        <div class="results-grid">
                            ${createCard('Cotação Atual', apenasValor(data.cotacao))}
                            ${createCard('P/L', data.pl)}
                            ${createCard('P/VP', data.pvp)}
                        </div>
                        <div class="section-title">Rentabilidade & Dividendos</div>
                        <div class="results-grid">
                            ${createCard('DY (12M)', data.dy)}
                            ${createCard('ROE', data.roe)}
                            ${createCard('Margem Líquida', data.margemLiquida)}
                        </div>
                    `; // Você pode restaurar todos os cards completos da sua versão anterior aqui dentro!
                }
            } catch (error) {
                container.innerHTML = `<div class="message" style="color: var(--bad);">Erro de conexão com o Motor Quântico.</div>`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
